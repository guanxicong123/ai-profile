# Nginx configuration for AI Profile
# This configuration proxies requests to the Next.js application running on port 3001

upstream next_app {
    server localhost:3001;
}

server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # Main application location
    location /ai-profile/ {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /ai-profile/health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # API rate limiting (optional)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    
    location /ai-profile/api/ {
        limit_req zone=api_limit burst=200 nodelay;
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location /ai-profile/_next/static/ {
        proxy_pass http://next_app;
        proxy_cache off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public files
    location /ai-profile/public/ {
        proxy_pass http://next_app;
        add_header Cache-Control "public, max-age=86400";
    }
}

